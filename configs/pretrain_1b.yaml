# Nova 1B 预训练配置
model:
  hidden_size: 2048
  num_hidden_layers: 24
  num_attention_heads: 32
  num_key_value_heads: 8
  intermediate_size: 5632
  vocab_size: 32000
  max_position_embeddings: 4096
  rms_norm_eps: 1.0e-5
  rope_theta: 10000.0
training:
  batch_size: 32
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 2000
  max_steps: 100000
  lr_scheduler: cosine
  grad_clip: 1.0
  mixed_precision: bf16
  seed: 42
data:
  train_file: data/train.jsonl
  val_file: data/val.jsonl
  max_seq_len: 4096
  num_workers: 4
checkpoint:
  output_dir: checkpoints/nova-1b
  save_steps: 1000
  save_total_limit: 5
  eval_steps: 500
  log_steps: 10
distributed:
  backend: nccl
  ddp: true
