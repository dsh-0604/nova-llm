# Nova 7B 预训练配置
model:
  hidden_size: 4096
  num_hidden_layers: 32
  num_attention_heads: 32
  num_key_value_heads: 8
  intermediate_size: 11008
  vocab_size: 32000
  max_position_embeddings: 4096

training:
  batch_size: 16
  gradient_accumulation_steps: 8
  learning_rate: 1.5e-4
  min_lr: 1.5e-5
  weight_decay: 0.1
  warmup_steps: 2000
  max_steps: 200000
  mixed_precision: bf16
  grad_clip: 1.0

data:
  max_seq_len: 4096

checkpoint:
  output_dir: checkpoints/nova-7b
  save_steps: 2000
