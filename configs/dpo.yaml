# DPO 直接偏好优化配置
model:
  pretrained_path: checkpoints/nova-1b-sft
  hidden_size: 2048
  num_hidden_layers: 24
  num_attention_heads: 32
  num_key_value_heads: 8
  intermediate_size: 5632
  vocab_size: 32000
training:
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-7
  warmup_steps: 50
  max_steps: 1000
  mixed_precision: bf16
  grad_clip: 1.0
  dpo_beta: 0.1
  dpo_loss_type: sigmoid
data:
  train_file: data/preference_train.jsonl
  max_seq_len: 4096
  max_prompt_len: 1024
checkpoint:
  output_dir: checkpoints/nova-1b-dpo
  save_steps: 200
