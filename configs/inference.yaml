# 推理配置
model:
  checkpoint_path: checkpoints/nova-1b
  hidden_size: 2048
  num_hidden_layers: 24
  num_attention_heads: 32
  num_key_value_heads: 8
  intermediate_size: 5632
  vocab_size: 32000
  max_position_embeddings: 4096
inference:
  device: cuda
  dtype: float16
  quantize: null
  kv_cache_type: paged
  max_batch_size: 32
  max_seq_len: 4096
  block_size: 16
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  do_sample: true
server:
  host: 0.0.0.0
  port: 8000
  api_key: null
